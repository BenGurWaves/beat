<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat // High-Precision Error Calculator</title>
    <meta name="description" content="Watch Beat Error Calculator - High-precision tool for watchmakers to calculate mechanical movement symmetry. Measure tick and tock timing to determine beat error in milliseconds.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" crossorigin>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0B0E12;
            color: #F0F4F8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(47, 60, 72, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(47, 60, 72, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: #F0F4F8;
            margin-bottom: 8px;
        }

        .logo .highlight {
            color: #2F3C48;
        }

        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.2em;
            color: #A9B8C5;
            text-transform: uppercase;
        }

        .sphere-container {
            position: relative;
            width: 100%;
            height: 300px;
            margin-bottom: 32px;
            cursor: grab;
            user-select: none;
        }

        .sphere-container:active {
            cursor: grabbing;
        }

        .sphere {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(240, 244, 248, 0.4), rgba(169, 184, 197, 0.2));
            box-shadow: 
                0 0 60px rgba(169, 184, 197, 0.3),
                inset 0 0 30px rgba(240, 244, 248, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sphere.perfect {
            background: radial-gradient(circle at 30% 30%, rgba(240, 244, 248, 0.6), rgba(169, 184, 197, 0.3));
            box-shadow: 
                0 0 80px rgba(74, 222, 128, 0.4),
                inset 0 0 40px rgba(74, 222, 128, 0.2);
        }

        .sphere-guide {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.15em;
            color: #2F3C48;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .values {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 0 20px;
        }

        .value-group {
            text-align: center;
        }

        .value-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.15em;
            color: #A9B8C5;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            color: #F0F4F8;
            font-variant-numeric: tabular-nums;
        }

        .result {
            text-align: center;
            padding: 24px;
            background: rgba(11, 14, 18, 0.5);
            border: 1px solid rgba(47, 60, 72, 0.3);
            border-radius: 12px;
        }

        .result-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            color: #A9B8C5;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 42px;
            font-weight: 300;
            color: #F0F4F8;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .result-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            color: #A9B8C5;
            text-transform: uppercase;
        }

        .status {
            margin-top: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.15em;
            color: #2F3C48;
            text-transform: uppercase;
            padding: 6px 12px;
            background: rgba(47, 60, 72, 0.2);
            border-radius: 4px;
            display: inline-block;
        }

        .status.excellent {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.15);
        }

        .status.fair {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
        }

        .status.poor {
            color: #f87171;
            background: rgba(248, 113, 113, 0.15);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.2em;
            color: #2F3C48;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                max-width: 100%;
            }

            .logo {
                font-size: 32px;
            }

            .sphere-container {
                height: 250px;
            }

            .sphere {
                width: 100px;
                height: 100px;
            }

            .result-value {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><span class="highlight">B</span>EA<span class="highlight">T</span></div>
            <div class="tagline">High-Precision Error Calculator</div>
        </div>

        <div class="sphere-container" id="sphereContainer">
            <div class="sphere" id="sphere"></div>
            <div class="sphere-guide">Drag sphere to adjust timing</div>
        </div>

        <div class="values">
            <div class="value-group">
                <div class="value-label">Tick</div>
                <div class="value-display" id="tickValue">0.00 ms</div>
            </div>
            <div class="value-group">
                <div class="value-label">Tock</div>
                <div class="value-display" id="tockValue">0.00 ms</div>
            </div>
        </div>

        <div class="result">
            <div class="result-label">Beat Error</div>
            <div class="result-value" id="beatError">0.00</div>
            <div class="result-unit">milliseconds</div>
            <div class="status" id="status">Awaiting Input</div>
        </div>

        <div class="footer">
            CALYVENT // PRECISION HOROLOGY
        </div>
    </div>

    <script>
        let tick = 5.00;
        let tock = 5.00;
        let isDragging = false;
        let startX = 0;

        const sphereContainer = document.getElementById('sphereContainer');
        const sphere = document.getElementById('sphere');
        const tickValue = document.getElementById('tickValue');
        const tockValue = document.getElementById('tockValue');
        const beatError = document.getElementById('beatError');
        const status = document.getElementById('status');

        function calculateBeatError() {
            if (tick <= 0 || tock <= 0) {
                beatError.textContent = '0.00';
                status.textContent = 'Awaiting Input';
                status.className = 'status';
                sphere.classList.remove('perfect');
                return;
            }

            const error = Math.abs(tick - tock) / 2;
            beatError.textContent = error.toFixed(2);

            if (error < 0.5) {
                status.textContent = 'Excellent Symmetry';
                status.className = 'status excellent';
                sphere.classList.add('perfect');
            } else if (error <= 1.0) {
                status.textContent = 'Adjust Recommended';
                status.className = 'status fair';
                sphere.classList.remove('perfect');
            } else {
                status.textContent = 'Requires Regulation';
                status.className = 'status poor';
                sphere.classList.remove('perfect');
            }

            updateSphere();
        }

        function updateSphere() {
            const diff = tick - tock;
            const maxOffset = 60;
            const offset = Math.max(-maxOffset, Math.min(maxOffset, diff * 20));
            sphere.style.transform = `translate(calc(-50% + ${offset}px), -50%)`;
            
            const scale = 1 + (Math.abs(diff) * 0.05);
            sphere.style.width = `${120 * scale}px`;
            sphere.style.height = `${120 * scale}px`;
        }

        function updateDisplay() {
            tickValue.textContent = tick.toFixed(2) + ' ms';
            tockValue.textContent = tock.toFixed(2) + ' ms';
            calculateBeatError();
        }

        sphereContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            sphereContainer.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.clientX - startX;
            const sensitivity = 0.01;
            
            tick = Math.max(0.1, Math.min(10, tick + deltaX * sensitivity));
            tock = Math.max(0.1, Math.min(10, tock - deltaX * sensitivity));
            
            startX = e.clientX;
            updateDisplay();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            sphereContainer.style.cursor = 'grab';
        });

        // Touch support
        sphereContainer.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            
            const deltaX = e.touches[0].clientX - startX;
            const sensitivity = 0.01;
            
            tick = Math.max(0.1, Math.min(10, tick + deltaX * sensitivity));
            tock = Math.max(0.1, Math.min(10, tock - deltaX * sensitivity));
            
            startX = e.touches[0].clientX;
            updateDisplay();
        });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
