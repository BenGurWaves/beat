<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat // High-Precision Error Calculator</title>
    <meta name="description" content="Watch Beat Error Calculator - High-precision tool for watchmakers to calculate mechanical movement symmetry. Measure tick and tock timing to determine beat error in milliseconds.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #080808;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 0.3em;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .logo .highlight {
            color: #444444;
        }

        .tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            color: #888888;
            text-transform: uppercase;
        }

        .calculator {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 32px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-btn {
            width: 44px;
            height: 44px;
            border: 1px solid #333333;
            background: #1a1a1a;
            color: #888888;
            font-size: 18px;
            font-weight: 300;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: #222222;
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        .input-value {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            text-align: center;
            background: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 6px;
            padding: 8px;
            outline: none;
        }

        .input-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #666666;
            text-transform: uppercase;
            width: 40px;
        }

        .result {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #333333;
            text-align: center;
        }

        .result-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .result-value {
            font-size: 36px;
            font-weight: 300;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .result-unit {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.1em;
            color: #888888;
            text-transform: uppercase;
        }

        .status {
            margin-top: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #666666;
            text-transform: uppercase;
            padding: 6px 12px;
            background: #1a1a1a;
            border-radius: 4px;
            display: inline-block;
        }

        .status.excellent {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .status.fair {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .status.poor {
            color: #f87171;
            background: rgba(248, 113, 113, 0.1);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: #666666;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                max-width: 100%;
            }

            .logo {
                font-size: 28px;
            }

            .calculator {
                padding: 24px;
            }

            .result-value {
                font-size: 32px;
            }

            .input-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><span class="highlight">B</span>EA<span class="highlight">T</span></div>
            <div class="tagline">High-Precision Error Calculator</div>
        </div>

        <div class="calculator">
            <div class="input-group">
                <div class="input-label">Tick Duration</div>
                <div class="input-row">
                    <button class="input-btn" id="tickDown">−</button>
                    <input type="text" class="input-value" id="tickValue" value="0.00" readonly>
                    <button class="input-btn" id="tickUp">+</button>
                    <div class="input-unit">ms</div>
                </div>
            </div>

            <div class="input-group">
                <div class="input-label">Tock Duration</div>
                <div class="input-row">
                    <button class="input-btn" id="tockDown">−</button>
                    <input type="text" class="input-value" id="tockValue" value="0.00" readonly>
                    <button class="input-btn" id="tockUp">+</button>
                    <div class="input-unit">ms</div>
                </div>
            </div>

            <div class="result">
                <div class="result-label">Beat Error</div>
                <div class="result-value" id="beatError">0.00</div>
                <div class="result-unit">milliseconds</div>
                <div class="status" id="status">Awaiting Input</div>
            </div>
        </div>

        <div class="footer">
            CALYVENT // PRECISION HOROLOGY
        </div>
    </div>

    <script>
        let tick = 0;
        let tock = 0;

        const tickValue = document.getElementById('tickValue');
        const tockValue = document.getElementById('tockValue');
        const beatError = document.getElementById('beatError');
        const status = document.getElementById('status');

        function calculateBeatError() {
            if (tick <= 0 || tock <= 0) {
                beatError.textContent = '0.00';
                status.textContent = 'Awaiting Input';
                status.className = 'status';
                return;
            }

            const error = Math.abs(tick - tock) / 2;
            beatError.textContent = error.toFixed(2);

            if (error < 0.5) {
                status.textContent = 'Excellent Symmetry';
                status.className = 'status excellent';
            } else if (error <= 1.0) {
                status.textContent = 'Adjust Recommended';
                status.className = 'status fair';
            } else {
                status.textContent = 'Requires Regulation';
                status.className = 'status poor';
            }
        }

        function adjustValue(field, delta) {
            if (field === 'tick') {
                tick = Math.max(0, Math.round((tick + delta) * 100) / 100);
                tickValue.value = tick.toFixed(2);
            } else {
                tock = Math.max(0, Math.round((tock + delta) * 100) / 100);
                tockValue.value = tock.toFixed(2);
            }
            calculateBeatError();
        }

        document.getElementById('tickDown').addEventListener('click', () => adjustValue('tick', -0.01));
        document.getElementById('tickUp').addEventListener('click', () => adjustValue('tick', 0.01));
        document.getElementById('tockDown').addEventListener('click', () => adjustValue('tock', -0.01));
        document.getElementById('tockUp').addEventListener('click', () => adjustValue('tock', 0.01));

        document.addEventListener('keydown', (e) => {
            const step = e.shiftKey ? 0.1 : 0.01;
            
            switch(e.key) {
                case 'ArrowUp':
                    adjustValue('tick', step);
                    break;
                case 'ArrowDown':
                    adjustValue('tick', -step);
                    break;
                case 'ArrowRight':
                    adjustValue('tock', step);
                    break;
                case 'ArrowLeft':
                    adjustValue('tock', -step);
                    break;
            }
        });
    </script>
</body>
</html>
